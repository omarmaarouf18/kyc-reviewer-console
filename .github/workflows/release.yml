name: Release Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

# Builds and publishes the console image consumed by saas-core-deploy's
# docker-compose.yml (service: kyc-reviewer-console). The compose file pins
# the tag via the KYC_CONSOLE_IMAGE_TAG env var; `latest` tracks main.
jobs:
  build-and-push:
    name: Build & Publish GHCR Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kyc-reviewer-console
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
