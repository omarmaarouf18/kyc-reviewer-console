name: Contract Sync (from saas-core)

on:
  repository_dispatch:
    types: [reviewer-api-contract]
  workflow_dispatch:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Contract & integration tests
        run: |
          go build ./...
          go vet ./...
          go test ./internal/proxy/... -count=1 -v
